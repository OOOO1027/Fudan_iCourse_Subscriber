name: Board Capture Pilot

# Dry run of the board stage (scripts/board_capture_pilot.py) on one lecture:
# pages extracted, read by the vision model, and the lecture summarised again
# with them. Runs only on pushes to the board-capture branch and writes nothing
# to the repository or the database: the result is one artifact, encrypted to
# scripts/board_review_key.pub.
on:
  push:
    branches: [board-capture]
    paths:
      - 'src/ai/board_capture.py'
      - 'src/ai/board_reader.py'
      - 'src/pipeline/board_stage.py'
      - 'src/pipeline/board_store.py'
      - 'src/pipeline/lecture_runner.py'
      - 'scripts/board_capture_pilot.py'
      - 'scripts/test_board_capture.py'
      - 'tests/test_board_stage.py'
      - '.github/workflows/board_capture_pilot.yml'

permissions:
  contents: read

concurrency:
  group: board-capture-pilot
  cancel-in-progress: true

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        # One entry per lecture.  skip_reading "1": extraction only, no vision
        # requests.  probe "1": ask every vision model for the same two boards
        # instead of running the stage.  693743 is 2026-10-28, the lecture the
        # extractor was built on; 710074 is 2026-11-18.
        include:
          - sub: "710074"
            skip_reading: "1"
            probe: ""
    env:
      BOARD_COURSE_ID: "38985"
      BOARD_SUB_ID: ${{ matrix.sub }}
      BOARD_SKIP_READING: ${{ matrix.skip_reading }}
      # Set to ask every vision model for the same two boards instead of running the stage.
      BOARD_PROBE: ${{ matrix.probe }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure encrypted session cache
        run: echo "ICOURSE_SESSION_FILE=$RUNNER_TEMP/icourse-auth/session.enc" >> "$GITHUB_ENV"

      # Read-only: reuse the scheduled check's session, never save one back.
      - name: Restore encrypted authentication session
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/icourse-auth/session.enc
          key: icourse-session-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: icourse-session-v1-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Python packages
        id: cache-pip
        uses: actions/cache@v4
        with:
          path: ${{ env.pythonLocation }}/lib/python*/site-packages
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        if: steps.cache-pip.outputs.cache-hit != 'true'
        run: pip install -r requirements.txt

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Unit tests
        run: python -m unittest discover -s tests

      - name: Test board capture on synthetic scenes
        run: python scripts/test_board_capture.py

      # Read-only copy of the database, for the lecture's transcript and PPT text.
      - name: Fetch and decode the database
        env:
          STUID: ${{ secrets.STUID }}
          UISPSW: ${{ secrets.UISPSW }}
        run: |
          git fetch --depth=1 origin "+refs/heads/data:refs/remotes/origin/data"
          mkdir -p "$RUNNER_TEMP/db/sharded/shards"
          git show origin/data:data/icourse-index.enc > "$RUNNER_TEMP/db/sharded/icourse-index.enc"
          for path in $(git ls-tree -r --name-only origin/data | grep '^data/shards/'); do
            git show "origin/data:$path" > "$RUNNER_TEMP/db/sharded/shards/$(basename "$path")"
          done
          python scripts/db_shard.py reassemble "$RUNNER_TEMP/db/sharded" "$RUNNER_TEMP/db/icourse.db"

      # Pages extracted by an earlier run, encrypted with the database password.
      - name: Restore extracted pages
        id: pages
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/board-pages
          key: board-pages-v1-${{ env.BOARD_SUB_ID }}-${{ hashFiles('src/ai/board_capture.py') }}

      - name: Run the board stage on one lecture
        timeout-minutes: 85
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          UIS_TOTP_SECRET: ${{ secrets.UIS_TOTP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          BOARD_DB: ${{ runner.temp }}/db/icourse.db
          BOARD_PAGE_CACHE: ${{ runner.temp }}/board-pages
          BOARD_OUTPUT: ${{ runner.temp }}/board-review
        run: python -u scripts/board_capture_pilot.py

      - name: Save extracted pages
        if: always() && steps.pages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/board-pages
          key: board-pages-v1-${{ env.BOARD_SUB_ID }}-${{ hashFiles('src/ai/board_capture.py') }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-review-${{ matrix.sub }}
          path: ${{ runner.temp }}/board-review/bundle.bin
          if-no-files-found: ignore
          retention-days: 7
