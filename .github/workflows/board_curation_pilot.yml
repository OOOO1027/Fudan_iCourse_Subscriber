name: Saved Board Curation Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/ai/board_curator.py', 'scripts/board_curation_pilot.py', '.github/workflows/board_curation_pilot.yml']
permissions:
  contents: write
concurrency:
  group: saved-board-curation-pilot
  cancel-in-progress: true
jobs:
  curate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow pycryptodome
      - uses: actions/checkout@v4
        with:
          ref: adaptive-board-evidence
          path: saved-evidence
          sparse-checkout: evidence/41802975078-1
      - run: python scripts/test_board_curator.py
      - name: Curate saved images without video or model calls
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          CURATION_SOURCE: ${{ github.workspace }}/saved-evidence
          CURATION_OUTPUT: ${{ runner.temp }}/curation-evidence
          OPENBLAS_NUM_THREADS: '2'
        run: python -u scripts/board_curation_pilot.py
      - name: Retain separate encrypted reading set
        env:
          CURATION_OUTPUT: ${{ runner.temp }}/curation-evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin board-curation-evidence; then
            git checkout -B board-curation-evidence origin/board-curation-evidence
          else
            git checkout --orphan board-curation-evidence
            git rm -r --cached .
          fi
          dest="evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          cp "$CURATION_OUTPUT/"*.enc "$dest/"
          python - <<'PY'
          import base64, os
          from pathlib import Path
          dest=Path('evidence')/(os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT'])
          for source in dest.glob('*.jpg.enc'):
              encoded=base64.b64encode(source.read_bytes()).decode()
              for i,start in enumerate(range(0,len(encoded),300000)):
                  (dest/(source.name+f'.b64.{i:03d}')).write_text(encoded[start:start+300000])
          PY
          git add "$dest"
          git commit -m "Retain encrypted offline curation ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git push origin HEAD:board-curation-evidence; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-curation-evidence
          path: ${{ runner.temp }}/curation-evidence/*.enc
          if-no-files-found: ignore
          retention-days: 30
