name: Board Vision Pilot
on:
  workflow_dispatch:
    inputs:
      resume_evidence:
        description: 'Evidence directory to resume, or fresh for a new course sample'
        type: string
        default: fresh
  push:
    branches: [main]
    paths: ['scripts/board_vision_pilot.py', 'scripts/board_vision_resume.py', '.github/workflows/board_vision_pilot.yml']
permissions:
  contents: write
concurrency:
  group: board-vision-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PILOT_RESUME: ${{ github.event_name == 'push' && '41789752625-1' || inputs.resume_evidence }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - uses: actions/cache@v4
        id: models
        with:
          path: |
            sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/
            silero_vad.onnx
          key: asr-models-sense-voice-2024-07-17
      - if: steps.models.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar xf sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
      - run: python scripts/test_board_vision_pilot.py
      - name: Probe images and sample latest NLP replay
        timeout-minutes: 45
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          COURSE_IDS: ${{ secrets.COURSE_IDS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PILOT_OUTPUT: ${{ runner.temp }}/board-evidence
          PILOT_SOURCE: ${{ runner.temp }}/board-source
        run: |
          if [ "$PILOT_RESUME" = fresh ]; then
            python -u scripts/board_vision_pilot.py
          else
            [[ "$PILOT_RESUME" =~ ^[0-9]+-[0-9]+$ ]] || exit 1
            git fetch origin board-vision-evidence
            mkdir -p "$PILOT_SOURCE"
            git archive FETCH_HEAD "evidence/$PILOT_RESUME" | tar -x --strip-components=2 -C "$PILOT_SOURCE"
            python -u scripts/board_vision_resume.py
          fi
      - name: Preserve encrypted originals independently of production data
        if: always()
        env:
          PILOT_OUTPUT: ${{ runner.temp }}/board-evidence
        run: |
          test -d "$PILOT_OUTPUT" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin board-vision-evidence; then
            git checkout -B board-vision-evidence origin/board-vision-evidence
          else
            git checkout --orphan board-vision-evidence
            git rm -r --cached .
          fi
          dest="evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          cp "$PILOT_OUTPUT/"*.enc "$dest/"
          git add "$dest"
          git commit -m "Preserve encrypted board pilot evidence ${GITHUB_RUN_ID}"
          git push origin HEAD:board-vision-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-board-evidence
          path: ${{ runner.temp }}/board-evidence/*.enc
          if-no-files-found: ignore
          retention-days: 30
