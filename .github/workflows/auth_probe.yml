name: iCourse Auth Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Inspect official public email API contract
        run: |
          python - <<'PY'
          import re, requests
          from urllib.parse import urljoin
          base = 'https://id.fudan.edu.cn/ac/'
          html = requests.get(base, timeout=60).text
          urls = [urljoin(base, p) for p in re.findall(r'<script[^>]+src=["\']([^"\']+)', html)]
          urls.append(base + 'js/chunk-71ba4ca7.61b64444.js')
          for url in dict.fromkeys(urls):
              source = requests.get(url, timeout=60).text
              for match in re.finditer('sendMailMsg', source):
                  print('PUBLIC_SOURCE', url, source[max(0, match.start()-1500):match.end()+1800])
          PY
