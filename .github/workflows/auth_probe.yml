name: iCourse Auth Probe
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: icourse-auth-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pycryptodome python-dotenv
      - name: Inspect public QR waiting rules
        run: |
          python - <<'PY'
          import re
          import requests
          url = 'https://id.fudan.edu.cn/ac/js/chunk-71ba4ca7.61b64444.js'
          response = requests.get(url, timeout=(15, 60))
          response.raise_for_status()
          source = response.text
          for match in re.finditer('4005', source):
              print(source[max(0, match.start()-300):match.end()+500])
          for match in re.finditer('getSubmitUrl:function', source):
              block = source[match.start():match.start()+5000]
              if 'authTxt' in block:
                  print(block)
          PY
