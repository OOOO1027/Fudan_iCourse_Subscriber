name: iCourse Auth Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/probe_icourse_auth.py
      - .github/workflows/auth_probe.yml
permissions:
  contents: read
concurrency:
  group: icourse-auth-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pycryptodome python-dotenv
      - name: Probe authentication and course reads
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          COURSE_IDS: ${{ secrets.COURSE_IDS }}
        run: python -u scripts/probe_icourse_auth.py
