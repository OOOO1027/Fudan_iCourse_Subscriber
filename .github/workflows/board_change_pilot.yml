name: Adaptive Board Selection Pilot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/ai/board_selector.py', 'scripts/board_change_pilot.py', '.github/workflows/board_change_pilot.yml']
permissions:
  contents: write
concurrency:
  group: adaptive-board-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - uses: actions/cache@v4
        id: models
        with:
          path: |
            sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17/
            silero_vad.onnx
          key: asr-models-sense-voice-2024-07-17
      - if: steps.models.outputs.cache-hit != 'true'
        run: |
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          tar xf sherpa-onnx-sense-voice-zh-en-ja-ko-yue-2024-07-17.tar.bz2
          wget -q https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/silero_vad.onnx
      - run: python scripts/test_board_selector.py
      - name: Full lecture selection and alignment trial
        timeout-minutes: 85
        env:
          StuId: ${{ secrets.STUID }}
          UISPsw: ${{ secrets.UISPSW }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PILOT_OUTPUT: ${{ runner.temp }}/adaptive-evidence
        run: python -u scripts/board_change_pilot.py
      - name: Retain encrypted originals and report
        if: always()
        env:
          PILOT_OUTPUT: ${{ runner.temp }}/adaptive-evidence
        run: |
          test -d "$PILOT_OUTPUT" || exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git fetch origin adaptive-board-evidence; then
            git checkout -B adaptive-board-evidence origin/adaptive-board-evidence
          else
            git checkout --orphan adaptive-board-evidence
            git rm -r --cached .
          fi
          dest="evidence/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "$dest"
          cp "$PILOT_OUTPUT/"*.enc "$dest/"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          dest = Path('evidence') / (os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          preview = dest / 'contact-sheet.jpg.enc'
          if preview.exists():
              text = base64.b64encode(preview.read_bytes()).decode()
              for index, offset in enumerate(range(0,len(text),300000)):
                  (dest / f'preview.b64.{index:03d}').write_text(text[offset:offset+300000])
          PY
          git add "$dest"
          git commit -m "Retain encrypted adaptive board trial ${GITHUB_RUN_ID}"
          git push origin HEAD:adaptive-board-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adaptive-board-evidence
          path: ${{ runner.temp }}/adaptive-evidence/*.enc
          if-no-files-found: ignore
          retention-days: 30
